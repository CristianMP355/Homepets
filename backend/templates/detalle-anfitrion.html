<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HuellaHome - Detalles de anfitrión</title>
  {% include "base_head.html" %}
</head>
<body class="app-body">
  {% include "base_navbar.html" %}
  <main class="page page-detail page-with-fixed-btn">

    <header class="app-header">
      <button class="back-btn" onclick="window.location.href='/'">←</button>
      <span class="app-title">Detalles del anfitrión</span>
      <span></span>
    </header>

    <section id="host-detail"></section>

  </main>

  <button
    class="btn-primary"
    id="btn-chat"
    style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:380px;"
  >
    💬 Chatear con anfitrión
  </button>

  <!-- ── MODAL CALENDARIO ─────────────────────────────── -->
  <div class="calendar-overlay" id="calendar-modal">
    <div class="calendar-box">
      <div class="calendar-header">
        <button class="calendar-nav" id="prev-month">‹</button>
        <span id="calendar-title">Disponibilidad</span>
        <button class="calendar-nav" id="next-month">›</button>
      </div>

      <div class="calendar-grid" id="calendar-grid"></div>

      <p class="calendar-legend">
        <span><span class="legend-dot verde"></span> Disponible</span>
        <span><span class="legend-dot naranja"></span> Por confirmar</span>
        <span><span class="legend-dot rojo"></span> Ocupado</span>
      </p>

      <p id="calendar-error" style="display:none;" class="calendar-error-msg"></p>

      <div id="calendar-solicitar-wrap" style="display:none;margin-top:12px;">
        <p id="calendar-rango-info" class="calendar-solicitar-info"></p>
        <button class="btn-primary" id="btn-solicitar" style="width:100%;">
          Solicitar estas fechas
        </button>
      </div>

      <p id="calendar-intro" class="form-help" style="text-align:center;margin:10px 0 0;">
        Elige la fecha de llegada y la de salida para enviar tu solicitud al anfitrión.
      </p>
      <button type="button" id="btn-solo-chatear" class="ver-perfil-btn" style="margin:10px auto 0;display:flex;">
        💬 Solo quiero chatear, sin reservar
      </button>
    </div>
  </div>

  <!-- ── MODAL CHAT ────────────────────────────────────── -->
  <div class="calendar-overlay" id="chat-modal">
    <div class="calendar-box" style="max-width:520px;width:100%;">
      <div class="calendar-header">
        <span class="flex min-w-0 items-center gap-2">
          <span id="chat-titulo" class="truncate">Conversación</span>
          <button type="button" id="chat-ver-perfil" class="ver-perfil-btn">👤 Ver perfil</button>
        </span>
        <button class="calendar-close" id="chat-close">✕</button>
      </div>

      <div
        id="chat-mensajes"
        style="
          max-height:420px;
          overflow-y:auto;
          padding:12px;
          background:#fffaf5;
          border-radius:14px;
          margin-bottom:12px;
        "
      ></div>

      <form id="chat-form" style="display:flex;gap:8px;align-items:center;">
        <input
          type="text"
          id="chat-input"
          placeholder="Escribe un mensaje..."
          class="input-pill"
          style="flex:1;"
        >
        <button type="submit" class="chip">Enviar</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = "";
    const detailContainer = document.getElementById("host-detail");

    // ── Estado global ────────────────────────────────────
    let hostDetalleActual        = null;
    let esDuenoPerfil            = false;
    let currentCalendarDate      = new Date();
    let chatUsuarioActualAbierto = null;

    // Estado de selección de fechas
    let fechasNoDisponiblesActuales = [];
    let fechasSolicitadasActuales   = [];
    let fechasConfirmadasActuales   = [];
    let fechaInicioSel              = null;
    let fechaFinSel                 = null;

    // ── Helpers de sesión ────────────────────────────────
    function getHostSeleccionado() {
      try { return JSON.parse(localStorage.getItem("anfitrionSeleccionado")); }
      catch (e) { return null; }
    }

    function getUsuarioActual() {
      try { return JSON.parse(localStorage.getItem("usuarioActual")); }
      catch (e) { return null; }
    }

    function getAccessToken() {
      return localStorage.getItem("access_token");
    }

    // ── Helpers de fecha ─────────────────────────────────
    function formatearFechaLocal(year, monthIndex, day) {
      const mm = String(monthIndex + 1).padStart(2, "0");
      const dd = String(day).padStart(2, "0");
      return `${year}-${mm}-${dd}`;
    }

    function formatearFechaDisplay(fechaStr) {
      if (!fechaStr) return "";
      const [y, m, d] = fechaStr.split("-").map(Number);
      const meses = ["enero","febrero","marzo","abril","mayo","junio",
                     "julio","agosto","septiembre","octubre","noviembre","diciembre"];
      return `${d} de ${meses[m - 1]} de ${y}`;
    }

    function calcularNoches(inicio, fin) {
      const d1 = new Date(inicio + "T00:00:00");
      const d2 = new Date(fin + "T00:00:00");
      return Math.round((d2 - d1) / 86400000);
    }

    // Mantiene el parser existente para el fallback
    function parsearFechasNoDisponibles(valor) {
      if (!valor) return [];
      if (Array.isArray(valor)) return valor;
      if (typeof valor === "string") {
        const limpio = valor.trim();
        if (!limpio) return [];
        try {
          const parsed = JSON.parse(limpio);
          if (Array.isArray(parsed)) return parsed;
        } catch (e) {}
        return limpio.split(",").map(s => s.trim()).filter(Boolean);
      }
      return [];
    }

    // ── Lógica de selección de rango ─────────────────────
    function rangoTieneBloqueados(inicio, fin) {
      const bloqueadas = new Set([
        ...fechasNoDisponiblesActuales,
        ...fechasSolicitadasActuales,
        ...fechasConfirmadasActuales
      ]);
      let actual = new Date(inicio + "T00:00:00");
      const finDate = new Date(fin + "T00:00:00");
      while (actual <= finDate) {
        const f = formatearFechaLocal(
          actual.getFullYear(), actual.getMonth(), actual.getDate()
        );
        if (bloqueadas.has(f)) return true;
        actual.setDate(actual.getDate() + 1);
      }
      return false;
    }

    function seleccionarDia(fechaStr) {
      if (!fechaInicioSel || (fechaInicioSel && fechaFinSel)) {
        fechaInicioSel = fechaStr;
        fechaFinSel    = null;
      } else {
        if (fechaStr <= fechaInicioSel) {
          fechaInicioSel = fechaStr;
          fechaFinSel    = null;
        } else {
          if (rangoTieneBloqueados(fechaInicioSel, fechaStr)) {
            mostrarErrorCalendario("El rango incluye fechas no disponibles. Elige otras fechas.");
            return;
          }
          fechaFinSel = fechaStr;
        }
      }
      ocultarErrorCalendario();
      renderizarCalendario();
      actualizarBotonSolicitar();
    }

    // ── Error dentro del calendario ───────────────────────
    function mostrarErrorCalendario(msg) {
      const el = document.getElementById("calendar-error");
      if (el) { el.textContent = msg; el.style.display = "block"; }
    }

    function ocultarErrorCalendario() {
      const el = document.getElementById("calendar-error");
      if (el) el.style.display = "none";
    }

    // ── Botón solicitar ───────────────────────────────────
    function actualizarBotonSolicitar() {
      const wrap = document.getElementById("calendar-solicitar-wrap");
      const info = document.getElementById("calendar-rango-info");
      if (!wrap) return;

      if (esDuenoPerfil || !fechaInicioSel || !fechaFinSel) {
        wrap.style.display = "none";
        return;
      }

      const n = calcularNoches(fechaInicioSel, fechaFinSel);
      if (info) {
        info.textContent =
          `${formatearFechaDisplay(fechaInicioSel)} → ${formatearFechaDisplay(fechaFinSel)}` +
          ` · ${n} noche${n !== 1 ? "s" : ""}`;
      }
      wrap.style.display = "block";
    }

    // ── Renderizado del calendario ────────────────────────
    function renderizarCalendario() {
      const grid  = document.getElementById("calendar-grid");
      const title = document.getElementById("calendar-title");
      if (!grid || !title) return;

      const year  = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth();

      const nombresMeses = [
        "Enero","Febrero","Marzo","Abril","Mayo","Junio",
        "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
      ];
      title.textContent = `${nombresMeses[month]} ${year}`;
      grid.innerHTML = "";

      ["L","M","M","J","V","S","D"].forEach(d => {
        const wd = document.createElement("div");
        wd.className = "calendar-weekday";
        wd.textContent = d;
        grid.appendChild(wd);
      });

      const primerDia = new Date(year, month, 1);
      let inicioSemana = primerDia.getDay();
      inicioSemana = inicioSemana === 0 ? 6 : inicioSemana - 1;

      for (let i = 0; i < inicioSemana; i++) {
        const empty = document.createElement("div");
        empty.className = "calendar-day";
        empty.style.visibility = "hidden";
        grid.appendChild(empty);
      }

      const hoy       = new Date(); hoy.setHours(0, 0, 0, 0);
      const totalDias = new Date(year, month + 1, 0).getDate();

      const noDisp      = new Set(fechasNoDisponiblesActuales);
      const solicitadas = new Set(fechasSolicitadasActuales);
      const confirmadas = new Set(fechasConfirmadasActuales);

      for (let dia = 1; dia <= totalDias; dia++) {
        const fecha    = formatearFechaLocal(year, month, dia);
        const fechaObj = new Date(year, month, dia);
        const celda    = document.createElement("div");
        celda.className = "calendar-day";
        celda.textContent = dia;

        if (fechaObj < hoy) {
          celda.classList.add("pasado");
        } else if (confirmadas.has(fecha) || noDisp.has(fecha)) {
          celda.classList.add("ocupada");          // rojo: reserva confirmada o bloqueado por el anfitrión
          celda.title = confirmadas.has(fecha) ? "Ocupado (reserva confirmada)" : "No disponible";
        } else if (solicitadas.has(fecha)) {
          celda.classList.add("solicitada");       // naranja: por confirmar
          celda.title = "Por confirmar";
        } else {
          // Día disponible — aplicar estado de selección
          if (fecha === fechaInicioSel) {
            celda.classList.add("selected-start");
          } else if (fecha === fechaFinSel) {
            celda.classList.add("selected-end");
          } else if (
            fechaInicioSel && fechaFinSel &&
            fecha > fechaInicioSel && fecha < fechaFinSel
          ) {
            celda.classList.add("in-range");
          } else {
            celda.classList.add("disponible");
          }
          celda.addEventListener("click", () => seleccionarDia(fecha));
        }

        grid.appendChild(celda);
      }
    }

    // ── Abrir / cerrar calendario ─────────────────────────
    async function abrirCalendario() {
      const modal = document.getElementById("calendar-modal");
      if (!modal || !hostDetalleActual) return;

      // Resetear selección
      fechaInicioSel = null;
      fechaFinSel    = null;
      ocultarErrorCalendario();

      modal.classList.add("active");

      await cargarFechasOcupadas();

      actualizarBotonSolicitar();
      renderizarCalendario();
    }

    async function cargarFechasOcupadas() {
      if (!hostDetalleActual) return;
      try {
        const resp = await fetch(`${API_BASE}/anfitriones/${hostDetalleActual.id}/fechas-ocupadas`);
        if (!resp.ok) throw new Error("fallback");
        const data = await resp.json();
        fechasNoDisponiblesActuales = data.fechas_no_disponibles || [];
        fechasSolicitadasActuales   = data.fechas_solicitadas    || [];
        fechasConfirmadasActuales   = data.fechas_confirmadas    || [];
      } catch (_) {
        fechasNoDisponiblesActuales = parsearFechasNoDisponibles(hostDetalleActual.fechas_no_disponibles);
        fechasSolicitadasActuales   = [];
        fechasConfirmadasActuales   = [];
      }
    }

    // ── Solicitudes recibidas (vista del anfitrión / admin) ──
    const ESTADOS_SOLICITUD = {
      pendiente: { texto: "Por confirmar", clase: "naranja" },
      aceptada:  { texto: "Confirmada",    clase: "rojo" },
      rechazada: { texto: "Rechazada",     clase: "gris" }
    };

    async function cargarSolicitudesRecibidas() {
      const cont = document.getElementById("solicitudes-recibidas");
      if (!cont || !hostDetalleActual) return;

      try {
        const resp = await fetch(`${API_BASE}/anfitriones/${hostDetalleActual.id}/solicitudes`, {
          headers: { "Authorization": `Bearer ${getAccessToken()}` }
        });
        const data = await resp.json().catch(() => []);
        if (!resp.ok) {
          cont.innerHTML = `<p class="host-section-text">${data.detail || "No se pudieron cargar las solicitudes."}</p>`;
          return;
        }
        renderizarSolicitudesRecibidas(data);
      } catch (err) {
        console.error("Error cargando solicitudes:", err);
        cont.innerHTML = `<p class="host-section-text">Error de conexión cargando solicitudes.</p>`;
      }
    }

    function renderizarSolicitudesRecibidas(solicitudes) {
      const cont = document.getElementById("solicitudes-recibidas");
      if (!cont) return;

      if (!solicitudes.length) {
        cont.innerHTML = `<p class="host-section-text">Aún no tienes solicitudes de reserva.</p>`;
        return;
      }

      cont.innerHTML = "";
      solicitudes.forEach((s) => {
        const estado = ESTADOS_SOLICITUD[s.estado] || { texto: s.estado, clase: "gris" };
        const noches = calcularNoches(s.fecha_inicio, s.fecha_fin);
        const item = document.createElement("div");
        item.className = "solicitud-item";
        item.innerHTML = `
          <div class="solicitud-info">
            <strong>${s.solicitante_nombre}</strong>
            <span>${formatearFechaDisplay(s.fecha_inicio)} → ${formatearFechaDisplay(s.fecha_fin)}
              · ${noches} noche${noches !== 1 ? "s" : ""}</span>
            <span class="estado-badge ${estado.clase}">${estado.texto}</span>
          </div>
          ${s.estado === "pendiente" ? `
            <div class="solicitud-acciones">
              <button type="button" class="btn-confirmar" data-id="${s.id}" data-estado="aceptada">✔ Confirmar reserva</button>
              <button type="button" class="btn-rechazar" data-id="${s.id}" data-estado="rechazada">✕ Rechazar</button>
            </div>
          ` : ""}
        `;
        cont.appendChild(item);
      });

      cont.querySelectorAll("button[data-estado]").forEach((btn) => {
        btn.addEventListener("click", () => cambiarEstadoSolicitud(btn.dataset.id, btn.dataset.estado, btn));
      });
    }

    async function cambiarEstadoSolicitud(id, estado, btn) {
      const accion = estado === "aceptada" ? "confirmar" : "rechazar";
      if (!confirm(`¿Seguro que quieres ${accion} esta solicitud?`)) return;

      if (btn) btn.disabled = true;
      try {
        const resp = await fetch(`${API_BASE}/solicitudes/${id}/estado`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${getAccessToken()}`
          },
          body: JSON.stringify({ estado })
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          alert(data.detail || "No se pudo actualizar la solicitud.");
          if (btn) btn.disabled = false;
          return;
        }
        await cargarSolicitudesRecibidas();
        await cargarFechasOcupadas();
        renderizarCalendario();
      } catch (err) {
        console.error("Error actualizando solicitud:", err);
        alert("Error de conexión al actualizar la solicitud.");
        if (btn) btn.disabled = false;
      }
    }

    function cerrarCalendario() {
      const modal = document.getElementById("calendar-modal");
      if (!modal) return;
      modal.classList.remove("active");
      fechaInicioSel = null;
      fechaFinSel    = null;
      ocultarErrorCalendario();
      actualizarBotonSolicitar();
    }

    // Flujo principal: fechas → solicitud "pendiente" → mensaje automático → chat abierto
    async function confirmarSolicitud() {
      const token = getAccessToken();
      if (!token) {
        alert("Debes iniciar sesión para solicitar fechas.");
        window.location.href = "/auth";
        return;
      }
      if (!fechaInicioSel || !fechaFinSel || !hostDetalleActual) return;

      const btn = document.getElementById("btn-solicitar");
      if (btn) { btn.disabled = true; btn.textContent = "Enviando solicitud..."; }
      ocultarErrorCalendario();

      try {
        // a) Registrar la solicitud (el backend crea también el primer mensaje del chat)
        const resp = await fetch(`${API_BASE}/solicitudes`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            anfitrion_id: hostDetalleActual.id,
            fecha_inicio: fechaInicioSel,
            fecha_fin:    fechaFinSel
          })
        });
        const data = await resp.json().catch(() => ({}));

        if (resp.status === 401) {
          alert("Tu sesión expiró. Vuelve a iniciar sesión.");
          window.location.href = "/auth";
          return;
        }
        if (!resp.ok) {
          mostrarErrorCalendario(data.detail || "No se pudo crear la solicitud.");
          return;
        }

        // b) + c) Cerrar el calendario y abrir el chat con la conversación activa
        cerrarCalendario();
        await abrirChat(hostDetalleActual.usuario_id, hostDetalleActual.nombre || "Anfitrión");
        document.getElementById("chat-input")?.focus();
      } catch (err) {
        console.error("Error creando la solicitud:", err);
        mostrarErrorCalendario("Error de conexión. Inténtalo de nuevo.");
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = "Solicitar estas fechas"; }
      }
    }

    // Abrir chat sin reservar (p. ej. si ya tiene una solicitud pendiente o solo tiene preguntas)
    async function chatearSinReservar() {
      if (!hostDetalleActual) return;
      cerrarCalendario();
      await abrirChat(hostDetalleActual.usuario_id, hostDetalleActual.nombre || "Anfitrión");
    }

    // ── Chat (sin modificaciones respecto al original) ────
    async function obtenerConversacion(otroUsuarioId) {
      const token = getAccessToken();
      if (!token) return [];
      try {
        const response = await fetch(`${API_BASE}/mensajes/conversacion/${otroUsuarioId}`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });
        if (!response.ok) throw new Error("Error al obtener conversación");
        return await response.json();
      } catch (error) {
        console.error("Error obteniendo conversación:", error);
        return [];
      }
    }

    function renderizarConversacion(mensajes) {
      const contenedor = document.getElementById("chat-mensajes");
      const usuario    = getUsuarioActual();
      if (!contenedor || !usuario) return;

      contenedor.innerHTML = "";

      if (!mensajes || mensajes.length === 0) {
        contenedor.innerHTML = `<p style="margin:0;color:var(--muted);">Aún no hay mensajes en esta conversación.</p>`;
        return;
      }

      mensajes.forEach((msg) => {
        const esMio = Number(msg.emisor_id) === Number(usuario.id);
        const burbuja = document.createElement("div");
        burbuja.style.display       = "flex";
        burbuja.style.justifyContent = esMio ? "flex-end" : "flex-start";
        burbuja.style.marginBottom  = "10px";
        burbuja.innerHTML = `
          <div style="
            max-width:75%;padding:10px 12px;border-radius:16px;
            background:${esMio ? "#ffd8a8" : "#ffffff"};
            border:1px solid #f0e1d2;box-shadow:0 2px 8px rgba(0,0,0,0.04);
          ">
            <div style="font-size:0.95rem;color:#333;">${msg.contenido}</div>
            <div style="margin-top:6px;font-size:0.75rem;color:#777;text-align:right;">
              ${new Date(msg.fecha_envio).toLocaleString()}
              ${esMio ? ` · ${msg.leido ? "✓✓ Leído" : "✓ Enviado"}` : ""}
            </div>
          </div>
        `;
        contenedor.appendChild(burbuja);
      });

      contenedor.scrollTop = contenedor.scrollHeight;
    }

    async function abrirChat(otroUsuarioId, nombreUsuario) {
      const modal  = document.getElementById("chat-modal");
      const titulo = document.getElementById("chat-titulo");
      if (!modal || !titulo) return;

      chatUsuarioActualAbierto = otroUsuarioId;
      titulo.textContent = `Chat con ${nombreUsuario}`;
      modal.classList.add("active");

      const mensajes = await obtenerConversacion(otroUsuarioId);
      renderizarConversacion(mensajes);
    }

    function cerrarChat() {
      const modal = document.getElementById("chat-modal");
      if (!modal) return;
      modal.classList.remove("active");
      chatUsuarioActualAbierto = null;
    }

    async function enviarMensajeChat(e) {
      e.preventDefault();
      const input         = document.getElementById("chat-input");
      const usuarioDestino = chatUsuarioActualAbierto;
      const token         = getAccessToken();
      if (!input || !usuarioDestino || !token) return;

      const contenido = input.value.trim();
      if (!contenido) return;

      try {
        const response = await fetch(`${API_BASE}/mensajes`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ receptor_id: usuarioDestino, contenido })
        });

        if (!response.ok) throw new Error("No se pudo enviar el mensaje");

        input.value = "";
        const mensajes = await obtenerConversacion(usuarioDestino);
        renderizarConversacion(mensajes);
      } catch (error) {
        console.error("Error enviando mensaje:", error);
        alert("No se pudo enviar el mensaje.");
      }
    }

    // ── Carga del detalle del anfitrión ───────────────────
    async function renderHostDetail() {
      if (!detailContainer) return;

      const hostBase = getHostSeleccionado();
      if (!hostBase || !hostBase.id) {
        detailContainer.innerHTML = "<p>No se encontró la información del anfitrión.</p>";
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/anfitriones/${hostBase.id}/detalle`);
        const host     = await response.json();

        if (!response.ok) {
          detailContainer.innerHTML = "<p>No se pudo cargar el detalle del anfitrión.</p>";
          return;
        }

        hostDetalleActual = host;

        const usuarioActual  = getUsuarioActual();
        const esDuenoDelPerfil =
          usuarioActual &&
          usuarioActual.id &&
          Number(usuarioActual.id) === Number(host.usuario_id);

        esDuenoPerfil = !!esDuenoDelPerfil;
        const puedeGestionarReservas =
          esDuenoPerfil || !!(usuarioActual && usuarioActual.rol === "admin");

        const foto = host.foto && host.foto.trim() !== ""
          ? host.foto
          : "/static/img/anfitrion.jpg";

        const galeria = (host.fotos_espacio || []).map(item => `
          <img src="${item.ruta_foto}" alt="Foto del espacio"
               style="width:120px;height:120px;object-fit:cover;border-radius:14px;">
        `).join("");

        detailContainer.innerHTML = `
          <section style="margin-bottom:16px;">
            <img src="${foto}" alt="Foto del anfitrión" class="host-hero">
          </section>

          <section style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
            <div class="host-avatar">
              <img src="${foto}" alt="Foto anfitrión">
            </div>
            <div style="flex:1;">
              <h2 style="margin:0;font-size:1.2rem;">${host.nombre || "Anfitrión sin nombre"}</h2>
              <p style="margin:2px 0 0;font-size:0.9rem;color:var(--muted);">
                ${host.direccion || "Dirección no especificada"}
              </p>
            </div>
          </section>

          ${esDuenoDelPerfil ? `
            <div style="margin:0 0 14px;">
              <button id="btn-editar-anfitrion" class="btn-primary" style="width:100%;">
                Editar mi perfil de anfitrión
              </button>
            </div>
          ` : ""}

          ${usuarioActual && usuarioActual.rol === "admin" ? `
            <div style="margin:0 0 14px;">
              <button id="btn-eliminar-anfitrion" class="btn-primary" style="width:100%;background:#c0392b;">
                🗑️ Eliminar anfitrión (admin)
              </button>
            </div>
          ` : ""}

          <section class="host-section">
            <div class="host-section-header"><span>Sobre mí</span></div>
            <p class="host-section-text">
              ${host.descripcion || "Este anfitrión aún no ha agregado una descripción."}
            </p>
          </section>

          <section class="host-section">
            <div class="host-section-header"><span>Mi hogar</span></div>
            <p class="host-section-text" style="margin-bottom:10px;">
              ${host.direccion || "Dirección no especificada."}
            </p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
              <button id="btn-ver-ubicacion-detalle" type="button" style="
                display:inline-flex;align-items:center;gap:6px;padding:10px 14px;
                border:none;border-radius:999px;background:#f4eee7;color:#5f554a;
                font-size:0.82rem;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.08);
                transition:all 0.2s ease;">
                <span>📍</span><span>Ver ubicación</span>
              </button>
              <button id="btn-ver-disponibilidad" type="button" style="
                display:inline-flex;align-items:center;gap:6px;padding:10px 14px;
                border:none;border-radius:999px;background:#f4eee7;color:#5f554a;
                font-size:0.82rem;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.08);
                transition:all 0.2s ease;">
                <span>📅</span><span>Ver disponibilidad</span>
              </button>
            </div>
          </section>

          <section class="host-section">
            <div class="host-section-header"><span>Fotos del espacio</span></div>
            ${galeria
              ? `<div style="display:flex;gap:10px;overflow-x:auto;padding-top:10px;">${galeria}</div>`
              : `<p class="host-section-text">Este anfitrión aún no ha subido fotos del espacio.</p>`
            }
          </section>

          <section class="host-section">
            <div class="host-section-header"><span>Contacto</span></div>
            <p class="host-section-text">Teléfono: ${host.telefono || "No registrado."}</p>
            <p class="host-section-text">Correo: ${host.email || "No registrado."}</p>
          </section>

          ${puedeGestionarReservas ? `
            <section class="host-section">
              <div class="host-section-header"><span>📋 Solicitudes de reserva</span></div>
              <div id="solicitudes-recibidas"><p class="host-section-text">Cargando solicitudes...</p></div>
            </section>
          ` : ""}
        `;

        if (puedeGestionarReservas) {
          cargarSolicitudesRecibidas();
        }

        if (esDuenoDelPerfil) {
          document.getElementById("btn-editar-anfitrion")?.addEventListener("click", () => {
            localStorage.setItem("anfitrionEditar", JSON.stringify(host));
            window.location.href = "/perfil-anfitrion";
          });
        }

        document.getElementById("btn-eliminar-anfitrion")?.addEventListener("click", async () => {
          if (!confirm(`¿Eliminar definitivamente el anfitrión "${host.nombre || ""}"? Esta acción no se puede deshacer.`)) return;
          try {
            const resp = await fetch(`${API_BASE}/anfitriones/${host.id}`, {
              method: "DELETE",
              headers: { "Authorization": `Bearer ${getAccessToken()}` }
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
              alert(data.detail || "No se pudo eliminar el anfitrión.");
              return;
            }
            localStorage.removeItem("anfitrionSeleccionado");
            alert("Anfitrión eliminado correctamente.");
            window.location.href = "/";
          } catch (err) {
            console.error("Error eliminando anfitrión:", err);
            alert("Error de conexión al eliminar el anfitrión.");
          }
        });

        document.getElementById("btn-ver-ubicacion-detalle")?.addEventListener("click", () => {
          if (!host.direccion || host.direccion.trim() === "") {
            alert("Este anfitrión no tiene dirección registrada.");
            return;
          }
          const dir = encodeURIComponent(host.direccion);
          window.open(`https://www.google.com/maps/search/?api=1&query=${dir}`, "_blank");
        });

        document.getElementById("btn-ver-disponibilidad")?.addEventListener("click", abrirCalendario);

        document.getElementById("btn-chat")?.addEventListener("click", async () => {
          const usuarioActual = getUsuarioActual();
          if (!usuarioActual || !usuarioActual.id) {
            alert("Debes iniciar sesión.");
            window.location.href = "/auth";
            return;
          }
          if (!host || !host.usuario_id) {
            alert("No se pudo identificar al anfitrión.");
            return;
          }
          if (Number(usuarioActual.id) === Number(host.usuario_id)) {
            alert("Este es tu propio perfil.");
            return;
          }
          // El chat empieza eligiendo fechas en el calendario de disponibilidad
          await abrirCalendario();
        });

      } catch (error) {
        console.error("Error cargando detalle del anfitrión:", error);
        detailContainer.innerHTML = "<p>Error de conexión cargando el detalle.</p>";
      }
    }

    // ── Event listeners ───────────────────────────────────

    // Calendario — navegación
    document.getElementById("chat-ver-perfil")?.addEventListener("click", () => {
      if (chatUsuarioActualAbierto) {
        window.location.href = `/perfil-publico?id=${encodeURIComponent(chatUsuarioActualAbierto)}`;
      }
    });

    document.getElementById("calendar-modal")?.addEventListener("click", (e) => {
      if (e.target.id === "calendar-modal") cerrarCalendario();
    });

    document.getElementById("prev-month")?.addEventListener("click", () => {
      currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
      renderizarCalendario();
    });

    document.getElementById("next-month")?.addEventListener("click", () => {
      currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
      renderizarCalendario();
    });

    // Calendario — botón solicitar
    document.getElementById("btn-solicitar")?.addEventListener("click", confirmarSolicitud);
    document.getElementById("btn-solo-chatear")?.addEventListener("click", chatearSinReservar);

    // Chat
    document.getElementById("chat-close")?.addEventListener("click", cerrarChat);
    document.getElementById("chat-modal")?.addEventListener("click", (e) => {
      if (e.target === document.getElementById("chat-modal")) cerrarChat();
    });
    document.getElementById("chat-form")?.addEventListener("submit", enviarMensajeChat);

    // ── Inicializar ───────────────────────────────────────
    renderHostDetail();
  </script>
</body>
</html>
